<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Absensi Guru</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f6f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;width:90%;max-width:400px;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center}
h2{color:#2c3e50;margin-bottom:5px} 
input{width:90%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;font-size:16px}
button{width:95%;padding:14px;margin:8px 0;border:none;border-radius:8px;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.masuk{background:#27ae60} .pulang{background:#e74c3c} 
#pesan{margin-top:15px;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <h2>📝 ABSENSI GURU</h2>
  <p>SMP KARTIKA XIV BANDA ACEH</p>
  <input type="text" id="nama" placeholder="Nama Lengkap" required>
  <input type="text" id="nip" placeholder="NIP" required>
  <button class="masuk" onclick="absen('Masuk')">HADIR MASUK</button>
  <button class="pulang" onclick="absen('Pulang')">HADIR PULANG</button>
  <p id="pesan"></p>
</div>
<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxAFB5qCfhKvh30jel7aK1i-TBTEJRJ5YoEyvoXfICzCQg6uyr5g5riEisvHw9jZRXo/exec";

function absen(jenis){
  const nama = document.getElementById('nama').value.trim();
  const nip = document.getElementById('nip').value.trim();
  const pesan = document.getElementById('pesan');
  if(!nama || !nip){ alert("Nama dan NIP wajib diisi"); return; }
  
  pesan.style.color = "blue"; pesan.innerText = "Mengirim data...";

  navigator.geolocation.getCurrentPosition(pos => {
    const lokasi = pos.coords.latitude + ", " + pos.coords.longitude;
    fetch(URL_SCRIPT, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({nama:nama, nip:nip, jenis:jenis, lokasi:lokasi})
    })
    .then(() => {
      pesan.style.color = "green";
      pesan.innerText = "✅ Berhasil Absen " + jenis + " Jam " + new Date().toLocaleTimeString('id-ID');
      document.getElementById('nama').value = "";
      document.getElementById('nip').value = "";
    })
    .catch(err => {
      pesan.style.color = "red"; pesan.innerText = "❌ Gagal: Cek koneksi";
    });
  }, () => {
    alert("Mohon izinkan akses lokasi");
  });
}
</script>
</body>
</html>
