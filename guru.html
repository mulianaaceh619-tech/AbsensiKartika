<script>
  // PENTING: Ganti URL di bawah ini dengan URL eksekusi Web App Google Script (/exec) milik Anda yang paling baru
  const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbxPASTE_URL_KAMU_DI_SINI/exec";
  
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "kartika123";

  window.onload = function() {
    const hariIni = new Date();
    const yyyy = hariIni.getFullYear();
    const mm = String(hariIni.getMonth() + 1).padStart(2, '0');
    const dd = String(hariIni.getDate()).padStart(2, '0');
    document.getElementById('filterTanggal').value = `${yyyy}-${mm}-${dd}`;
  };

  function loginAdmin() {
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    const loginError = document.getElementById('loginError');

    if(user === ADMIN_USER && pass === ADMIN_PASS) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('rekapPage').style.display = 'block';
      loadData();
    } else {
      loginError.innerText = "❌ Username atau Password salah!";
    }
  }
  
  function logout() {
    document.getElementById('rekapPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('adminUser').value = "";
    document.getElementById('adminPass').value = "";
    document.getElementById('loginError').innerText = "";
  }

  function cetakAbsen() {
    const tgl = document.getElementById('filterTanggal').value;
    document.title = `Rekap Absen Guru ${tgl}`;
    window.print();
  }

  async function loadData() {
    const tgl = document.getElementById('filterTanggal').value;
    document.getElementById('infoTanggal').innerText = `Data Tanggal: ${tgl}`;
    
    const loadingText = document.getElementById('loading');
    const tabelAbsen = document.getElementById('tabelAbsen');
    
    loadingText.style.display = 'block';
    loadingText.innerText = "⏳ Memuat data dari Google Sheets...";
    tabelAbsen.style.display = 'none';

    // Jembatan bypass CORS via Allorigins proxy API - SUDAH DIBENERIN
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(URL_GOOGLE_SCRIPT + '?tgl=' + tgl)}`;

    try {
      const respon = await fetch(proxyUrl);
      if (!respon.ok) throw new Error("Network error");
      
      const dataJson = await respon.json(); // Langsung json, ga perlu .contents
      
      tampilkanTabel(dataJson);
    } catch (error) {
      loadingText.innerText = "❌ Jalur koneksi diblokir. Harap pastikan kembali URL script Anda benar dan sudah dideploy ulang.";
      console.error(error);
    }
  }

  function tampilkanTabel(data) {
    const tbody = document.getElementById('isiTabel');
    tbody.innerHTML = "";
    
    if(!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8">Tidak ada data absen di tanggal ini</td></tr>`;
    } else {
      data.forEach((row, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td>${row.nama || '-'}</td>
            <td>${row.nip || '-'}</td>
            <td>${row.jam || '-'}</td>
            <td class="${row.status === 'Tepat Waktu' || row.status === 'Pulang' ? 'status-tepat' : 'status-telat'}">${row.status || '-'}</td>
            <td>${row.jenis || '-'}</td>
            <td>${row.hari || '-'}</td>
            <td><small>${row.lokasi || '-'}</small></td>
          </tr>
        `;
      });
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tabelAbsen').style.display = 'table';
  }
</script>
