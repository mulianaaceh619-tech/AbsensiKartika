<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Absensi Guru</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 20px; }
.container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h2 { text-align: center; color: #2c3e50; }
.controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
input[type="date"], button { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
.btn-tampil { background: #3498db; color: white; cursor: pointer; }
.btn-cetak { background: #2ecc71; color: white; cursor: pointer; }
.btn-logout { background: #e74c3c; color: white; cursor: pointer; margin-left: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
th { background: #3498db; color: white; }
.status-tepat { color: #2ecc71; font-weight: bold; }
.status-telat { color: #e74c3c; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h2>📊 REKAP ABSENSI GURU</h2>
  <p style="text-align:center; color:gray;">SMP KARTIKA XIV BANDA ACEH</p>

  <div class="controls">
    <div>
      <label><b>Pilih Tanggal:</b></label><br>
      <input type="date" id="tanggal">
    </div>
    <button class="btn-tampil" onclick="ambilData()">🔍 Tampilkan</button>
    <button class="btn-cetak" onclick="window.print()">🖨️ Cetak</button>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
  <h4 id="judulTanggal" style="text-align:center;"></h4>

  <table id="tabelAbsen" style="display:none;">
    <thead>
      <tr><th>No</th><th>Nama Guru</th><th>NIP</th><th>Jam Absen</th><th>Status</th><th>Jenis</th><th>Hari</th><th>Lokasi</th></tr>
    </thead>
    <tbody id="isiTabel"></tbody>
  </table>
</div>

<script>
const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbxuEthR7Zw4S4_NPw5y8g9HyO9mSZUimXi47UE5advSbsdWlE-SJJNVMoavZYJeZUyQ/exec";
const NAMA_HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const NAMA_BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"];

document.getElementById('tanggal').valueAsDate = new Date();

function ambilData() {
  const tglInput = document.getElementById('tanggal').value; // 2026-07-25
  if(!tglInput) return alert("Pilih tanggal dulu");

  const [yyyy, mm, dd] = tglInput.split("-");
  document.getElementById('judulTanggal').innerText = `Data Tanggal: ${dd}/${mm}/${yyyy}`;

  document.getElementById('tabelAbsen').style.display = 'none';
  document.getElementById('isiTabel').innerHTML = `<tr><td colspan="8">Memuat data...</td></tr>`;

  const script = document.createElement('script');
  script.src = `${URL_GOOGLE_SCRIPT}?tgl=${tglInput}&callback=tampilkanTabel`;
  document.body.appendChild(script);
}

function tampilkanTabel(data) {
  const tbody = document.getElementById('isiTabel');
  tbody.innerHTML = "";
  if(!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8">Tidak ada data absen di tanggal ini</td></tr>`;
  } else {
    data.forEach((row, i) => {
      // BUANG 1899
      let jamBersih = String(row.jam).split(" ")[4] || String(row.jam);
      if(jamBersih.length > 8) jamBersih = jamBersih.substring(0,8) + " WIB";

      const tglObj = new Date(row.tanggal);
      const hari = NAMA_HARI[tglObj.getDay()];
      const tglIndo = `${tglObj.getDate()} + NAMA_BULAN[tglObj.getMonth()] + " + tglObj.getFullYear()`;

      const kelas = (row.status.toLowerCase().includes('tepat') || row.jenis.toLowerCase() === 'pulang')? 'status-tepat' : 'status-telat';
      tbody.innerHTML += `<tr><td>${i+1}</td><td>${row.nama}</td><td>${row.nip}</td><td><b>${jamBersih}</b></td><td class="${kelas}">${row.status}</td><td>${row.jenis}</td><td>${hari}</td><td><small>${row.lokasi}</small></td></tr>`;
    });
  }
  document.getElementById('tabelAbsen').style.display = 'table';
}
function logout(){ window.location.href = 'index.html'; }
</script>
</body>
</html>
