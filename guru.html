<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi Guru SMP KARTIKA XIV</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: #f4f7f9; margin: 0; padding: 20px; }
   .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; }
   .sub { text-align: center; color: #7f8c8d; margin-bottom: 20px; }
   .login-box { max-width: 400px; margin: 50px auto; padding: 30px; border: 2px solid #3498db; border-radius: 15px; }
   .login-box input,.controls input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; }
   .login-box button,.controls button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
   .btn-refresh { background: #3498db; }
   .btn-cetak { background: #27ae60; }
   .btn-logout { background: #c0392b; float: right; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #3498db; color: white; }
   .status-tepat { color: #27ae60; font-weight: bold; }
   .status-telat { color: #c0392b; font-weight: bold; }
    #loading { text-align: center; padding: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📊 REKAP ABSENSI GURU</h2>
    <p class="sub">SMP KARTIKA XIV BANDA ACEH</p>

    <div id="loginPage" class="login-box">
      <h3 style="text-align:center;">Login Admin</h3>
      <input type="text" id="adminUser" placeholder="Username Admin">
      <input type="password" id="adminPass" placeholder="Password Admin">
      <button onclick="loginAdmin()" style="background:#3498db; width:100%;">Masuk</button>
      <p id="loginError" style="color:red; text-align:center; font-weight:bold;"></p>
    </div>

    <div id="rekapPage" style="display:none;">
      <div class="controls">
        <label><b>Pilih Tanggal:</b></label>
        <input type="date" id="filterTanggal">
        <button class="btn-refresh" onclick="loadData()">🔄 Tampilkan</button>
        <button class="btn-cetak" onclick="window.print()">🖨️ Cetak</button>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
      <div id="infoTanggal" style="text-align:center; font-weight:bold;"></div>
      <div id="loading">⏳ Silahkan pilih tanggal dan klik Tampilkan</div>
      <table id="tabelAbsen" style="display:none;">
        <thead><tr><th>No</th><th>Nama Guru</th><th>NIP</th><th>Jam Absen</th><th>Status</th><th>Jenis</th><th>Hari</th><th>Lokasi</th></tr></thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

<script>
  const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwlH9fZLMvHguJzeTrirZZRdAae3kXUlw39pVcBsOBHgp1u7r1nSb0o-9K8QSc4a6xX/exec";
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "kartika123";

  window.onload = function() {
    document.getElementById('filterTanggal').value = new Date().toISOString().split('T')[0];
  };

  function loginAdmin() {
    if(document.getElementById('adminUser').value === ADMIN_USER && document.getElementById('adminPass').value === ADMIN_PASS) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('rekapPage').style.display = 'block';
    } else {
      document.getElementById('loginError').innerText = "❌ Salah!";
    }
  }
  function logout() {
    document.getElementById('rekapPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
  }

  function loadData() {
    const tgl = document.getElementById('filterTanggal').value;
    document.getElementById('infoTanggal').innerText = `Data Tanggal: ${tgl}`;
    document.getElementById('loading').innerText = "⏳ Memuat data...";
    document.getElementById('tabelAbsen').style.display = 'none';
    
    const oldScript = document.getElementById('jsonpScript');
    if(oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'jsonpScript';
    script.src = `${URL_GOOGLE_SCRIPT}?tgl=${tgl}&callback=tampilkanTabel`;
    document.body.appendChild(script);
  }

  function tampilkanTabel(data) {
  document.getElementById('loading').style.display = 'none';
  const tbody = document.getElementById('isiTabel');
  tbody.innerHTML = "";

  if(data.error){
    tbody.innerHTML = `<tr><td colspan="8" style="color:red">ERROR: ${data.error}</td></tr>`;
    return;
  }
  if(data.msg){
    tbody.innerHTML = `<tr><td colspan="8" style="color:orange">${data.msg}</td></tr>`;
    return;
  }
  if(!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8">Tidak ada data sama sekali di Sheet</td></tr>`;
    return;
  }

  // TAMPILIN SEMUA DULU TANPA FILTER TANGGAL
  data.forEach((row, i) => {
    tbody.innerHTML += `<tr><td>${i+1}</td><td>${row.nama}</td><td>${row.nip}</td><td>${row.jam}</td><td>${row.status}</td><td>${row.jenis}</td><td>${row.hari}</td><td><small>${row.lokasi}</small><br><small>Tgl Sheet:${row.tanggal_sheet}</small></td></tr>`;
  });
  document.getElementById('tabelAbsen').style.display = 'table';
}
</script>
</body>
</html>
