<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Absensi Guru SMP KARTIKA XIV</title>
  <style>
    body { font-family: Arial; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
   .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
    h2 { color: #2c3e50; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
    button.pulang { background: #e67e22; }
    button:disabled { background: #95a5a6; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; font-size: 16px; }
   .tepat { color: green; }.telat { color: red; }.info { color: #3498db; }
   .jam-info { background: #ecf0f1; padding: 10px; border-radius: 8px; margin: 15px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card" id="loginBox">
    <h2>Absensi Guru</h2>
    <p>SMP KARTIKA XIV</p>
    <div class="jam-info" id="jamInfo"></div>
    <input type="text" id="nip" placeholder="Masukkan NIP">
    <input type="password" id="pass" placeholder="Masukkan Password">
    <button onclick="absen('masuk')">Absen Masuk</button>
    <button class="pulang" onclick="absen('pulang')">Absen Pulang</button>
    <div id="status"></div>
    <br><a href="/guru.html">Lihat Rekap Data</a>
  </div>

<script>
  const daftarGuru = [
    {nama: "Sabriadi,S.Pd", nip: "197705092007011016", pass: "guru12345"},
    {nama: "Ainal Mardhiah,S.Pd", nip: "19670810198012001", pass: "guru12345"},
    {nama: "Drs.Baihaki", nip: "196607192006041003", pass: "guru12345"},
    {nama: "Jemi Noven,S.Pd", nip: "199111032019031006", pass: "guru12345"},
    {nama: "Khalisna Fitri,S.Pd", nip: "123456", pass: "guru12345"},
    {nama: "Nabila Muridha,S.Pd", nip: "1234567", pass: "guru12345"},
    {nama: "Rina Diana,S.Pd,M.Pd", nip: "198007302006042014", pass: "guru12345"},
    {nama: "RUZIKNA,S.Pd", nip: "12345678", pass: "guru12345"},
    {nama: "Samsul Bahri,S.Pd", nip: "19811002200501003", pass: "guru12345"},
    {nama: "Siti Sarah,S.Pd", nip: "123456789", pass: "guru12345"},
    {nama: "Nanda Phonna,S.Pd", nip: "12345678910", pass: "guru12345"},
    {nama: "Dien jauhari,S.Pd,M.Pd", nip: "12345678911", pass: "guru12345"}
  ];

  // SETTING JAM
  const JAM_MASUK = "07:30:00";
  const JAM_PULANG = {
    1: "13:00:00", // Senin
    2: "13:00:00", // Selasa
    3: "13:00:00", // Rabu
    4: "13:00:00", // Kamis
    5: "11:30:00", // Jumat
    6: "12:00:00" // Sabtu
  };

  // TAMPILKAN INFO JAM HARI INI
  const hariIni = new Date().getDay(); // 0=Minggu, 1=Senin...
  const namaHari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const jamPulangHariIni = JAM_PULANG[hariIni] || "Libur";
  document.getElementById('jamInfo').innerHTML =
    `<b>Hari ini: ${namaHari[hariIni]}</b><br>
     Masuk: ${JAM_MASUK} | Pulang: ${jamPulangHariIni}`;

  function absen(jenis){
    const nip = document.getElementById('nip').value.trim();
    const pass = document.getElementById('pass').value.trim();
    const guru = daftarGuru.find(g => g.nip === nip && g.pass === pass);
    const status = document.getElementById('status');

    if(!guru){
      status.innerHTML = "NIP atau Password salah!";
      status.className = "telat";
      return;
    }

    const sekarang = new Date();
    const waktuSekarang = sekarang.toLocaleTimeString("id-ID");
    const tanggal = sekarang.toLocaleDateString("id-ID");

    let keterangan = "";
    let kelasCSS = "info";

    if(jenis === 'masuk'){
      keterangan = waktuSekarang <= JAM_MASUK? "Hadir Tepat Waktu" : "Terlambat Masuk";
      kelasCSS = waktuSekarang <= JAM_MASUK? "tepat" : "telat";
    }
    else { // pulang
      const jamPulang = JAM_PULANG[hariIni];
      keterangan = waktuSekarang >= jamPulang? "Pulang Tepat Waktu" : "Pulang Awal";
      kelasCSS = waktuSekarang >= jamPulang? "tepat" : "telat";
    }

    status.className = kelasCSS;
    status.innerHTML = `${guru.nama} <br>
                        ${jenis === 'masuk'? 'Absen Masuk' : 'Absen Pulang'}: ${waktuSekarang} <br>
                        Status: ${keterangan}`;

    // NANTI KIRIM KE GOOGLE SHEET
    console.log("Data Absen:", {nama: guru.nama, nip, tanggal, jenis, jam: waktuSekarang, status: keterangan});
  }
</script>
</body>
</html>
