<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi Guru SMP KARTIKA XIV</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial; background: #f4f7f9; margin: 0; padding: 20px; }
   .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
   .sub { text-align: center; color: #7f8c8d; margin-bottom: 20px; }
    
    /* LOGIN ADMIN */
   .login-box { max-width: 400px; margin: 50px auto; padding: 30px; border: 2px solid #3498db; border-radius: 15px; }
   .login-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; }
   .login-box button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* KONTROL */
   .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
   .controls input[type="date"] { padding: 10px; border-radius: 8px; border: 2px solid #ddd; }
   .controls button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
   .btn-cetak { background: #27ae60; }
   .btn-refresh { background: #3498db; }
   .btn-logout { background: #c0392b; margin-left: auto; }

    /* TABEL */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
   .status-tepat { color: #27ae60; font-weight: bold; }
   .status-telat { color: #c0392b; font-weight: bold; }
    #loading { text-align: center; padding: 20px; font-size: 16px; }

    /* PRINT */
    @media print {
      body { background: white; padding: 0; }
     .no-print { display: none; }
     .container { box-shadow: none; border: none; }
      h2 { font-size: 18pt; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📊 REKAP ABSENSI GURU</h2>
    <p class="sub">SMP KARTIKA XIV BANDA ACEH</p>

    <!-- HALAMAN LOGIN ADMIN -->
    <div id="loginPage" class="login-box no-print">
      <h3 style="text-align:center;">Login Admin</h3>
      <input type="text" id="adminUser" placeholder="Username Admin">
      <input type="password" id="adminPass" placeholder="Password Admin">
      <button onclick="loginAdmin()">Masuk</button>
      <p id="loginError" style="color:red; text-align:center;"></p>
    </div>

    <!-- HALAMAN REKAP -->
    <div id="rekapPage" style="display:none;">
      <div class="controls no-print">
        <label><b>Pilih Tanggal:</b></label>
        <input type="date" id="filterTanggal">
        <button class="btn-refresh" onclick="loadData()">🔄 Tampilkan</button>
        <button class="btn-cetak" onclick="cetakAbsen()">🖨️ Cetak / Save PDF</button>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
      <div id="infoTanggal" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
      <div id="loading">Memuat data...</div>
      <table id="tabelAbsen" style="display:none;">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Guru</th>
            <th>NIP</th>
            <th>Jam Masuk</th>
            <th>Status Masuk</th>
            <th>Jam Pulang</th>
            <th>Status Pulang</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

<script>
  // 1. GANTI INI DENGAN URL APPS SCRIPT KAMU
              const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwK6oScghDdOV1fxn42dMSq0kSEMNvIFXl_h2I7S-J88Nv41AVDsmjS6J3ZoDorCwX9/exec";
  
  // 2. GANTI USERNAME + PASSWORD ADMIN
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "kartika123";

  // Auto set tanggal hari ini
  document.getElementById('filterTanggal').valueAsDate = new Date();

  function loginAdmin() {
    const user = document.getElementById('adminUser').value;
    const pass = document.getElementById('adminPass').value;
    if(user === ADMIN_USER && pass === ADMIN_PASS) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('rekapPage').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginError').innerText = "Username atau Password salah!";
    }
  }
  
  function logout() {
    document.getElementById('rekapPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
  }

  function cetakAbsen() {
    const tgl = document.getElementById('filterTanggal').value;
    document.title = `Rekap Absen Guru ${tgl}`;
    window.print();
  }

  async function loadData() {
    const tgl = document.getElementById('filterTanggal').value;
    document.getElementById('infoTanggal').innerText = `Data Tanggal: ${tgl}`;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tabelAbsen').style.display = 'none';

    try {
      const res = await fetch(`${URL_GOOGLE_SCRIPT}?action=getData&tgl=${tgl}`);
      const data = await res.json();
      tampilkanTabel(data);
    } catch(err) {
      document.getElementById('loading').innerText = "Gagal memuat data. Cek URL Apps Script";
    }
  }

  function tampilkanTabel(data) {
    const tbody = document.getElementById('isiTabel');
    tbody.innerHTML = "";
    if(data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7">Tidak ada data absen di tanggal ini</td></tr>`;
    } else {
      data.forEach((row, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td>${row.nama}</td>
            <td>${row.nip}</td>
            <td>${row.jam_masuk || '-'}</td>
            <td class="${row.status_masuk === 'Tepat Waktu'? 'status-tepat' : 'status-telat'}">${row.status_masuk || '-'}</td>
            <td>${row.jam_pulang || '-'}</td>
            <td class="${row.status_pulang === 'Tepat Waktu'? 'status-tepat' : 'status-telat'}">${row.status_pulang || '-'}</td>
          </tr>
        `;
      });
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tabelAbsen').style.display = 'table';
  }
</script>
</body>
</html>
