<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Guru</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #27ae60; color: white; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <div class="card" id="loginBox">
    <h2>Login Guru</h2>
    <input type="password" id="pass" placeholder="Masukkan Password Guru">
    <button onclick="login()">Masuk</button>
    <p id="err" style="color:red"></p>
  </div>

  <div class="card" id="dataBox" style="display:none; max-width: 800px;">
    <h2>Data Absensi</h2>
    <button onclick="exportExcel()">Download Excel</button>
    <table id="tabelAbsen"><tr><th>Waktu</th><th>Nama</th><th>Kelas</th></tr></table>
  </div>

<script>
  const PASSWORD_GURU = "kartika123"; // ganti password nya
  const URL_GOOGLE_SHEET = "NANTI_KITA_ISI_DENGAN_LINK_APPS_SCRIPT"

  function login(){
    if(document.getElementById('pass').value === PASSWORD_GURU){
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dataBox').style.display = 'block';
      loadData();
    } else {
      document.getElementById('err').innerText = "Password salah!";
    }
  }

  function loadData(){
    // Nanti kita ambil data dari Google Sheet
    document.getElementById('tabelAbsen').innerHTML += "<tr><td colspan=3>Data akan muncul setelah disambung ke Google Sheet</td></tr>";
  }
</script>
</body>
</html>
