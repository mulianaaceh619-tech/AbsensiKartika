<script>
  const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbywJ1jre0rLKXtRJgrebZBXrEUQIM0LWi5VG1DecnTLUhnY6ua5yr50hQpiEXwu2R-X/exec";
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "kartika123";

  window.onload = function() {
    document.getElementById('filterTanggal').value = new Date().toISOString().split('T')[0];
  };

  function loginAdmin() {
    if(document.getElementById('adminUser').value === ADMIN_USER && document.getElementById('adminPass').value === ADMIN_PASS) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('rekapPage').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginError').innerText = "❌ Salah!";
    }
  }
  function logout() {
    document.getElementById('rekapPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
  }

  function loadData() {
    const tgl = document.getElementById('filterTanggal').value;
    document.getElementById('infoTanggal').innerText = `Data Tanggal: ${tgl}`;
    document.getElementById('loading').style.display = 'block';
    
    // HAPUS SCRIPT LAMA BIAR GA NUMPuk
    const oldScript = document.getElementById('jsonpScript');
    if(oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'jsonpScript';
    script.src = `${URL_GOOGLE_SCRIPT}?tgl=${tgl}&callback=tampilkanTabel`;
    document.body.appendChild(script);
  }

  function tampilkanTabel(data) {
    document.getElementById('loading').style.display = 'none';
    const tbody = document.getElementById('isiTabel');
    tbody.innerHTML = "";
    if(!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8">Tidak ada data</td></tr>`;
    } else {
      data.forEach((row, i) => {
        const kelas = (row.status === 'Tepat Waktu' || row.status === 'Pulang')? 'status-tepat' : 'status-telat';
        tbody.innerHTML += `<tr><td>${i+1}</td><td>${row.nama}</td><td>${row.nip}</td><td>${row.jam}</td><td class="${kelas}">${row.status}</td><td>${row.jenis}</td><td>${row.hari}</td><td><small>${row.lokasi}</small></td></tr>`;
      });
    }
    document.getElementById('tabelAbsen').style.display = 'table';
  }
</script>
