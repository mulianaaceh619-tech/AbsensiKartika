<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi Guru SMP KARTIKA XIV</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial; background: #f4f7f9; margin: 0; padding: 20px; }
   .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
   .sub { text-align: center; color: #7f8c8d; margin-bottom: 20px; }
   .login-box { max-width: 400px; margin: 50px auto; padding: 30px; border: 2px solid #3498db; border-radius: 15px; background: white; }
   .login-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; font-size: 15px; }
   .login-box button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
   .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
   .controls input[type="date"] { padding: 10px; border-radius: 8px; border: 2px solid #ddd; }
   .controls button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
   .btn-cetak { background: #27ae60; }
   .btn-refresh { background: #3498db; }
   .btn-logout { background: #c0392b; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
   .status-tepat { color: #27ae60; font-weight: bold; }
   .status-telat { color: #c0392b; font-weight: bold; }
    #loading { text-align: center; padding: 20px; font-size: 16px; font-weight: bold; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📊 REKAP ABSENSI GURU</h2>
    <p class="sub">SMP KARTIKA XIV BANDA ACEH</p>

    <div id="loginPage" class="login-box">
      <h3 style="text-align:center; color:#2c3e50;">Login Admin</h3>
      <input type="text" id="adminUser" placeholder="Username Admin">
      <input type="password" id="adminPass" placeholder="Password Admin">
      <button onclick="loginAdmin()">Masuk</button>
      <p id="loginError" style="color:red; text-align:center; font-weight:bold; margin-top:10px;"></p>
    </div>

    <div id="rekapPage" style="display:none;">
      <div class="controls">
        <label><b>Pilih Tanggal:</b></label>
        <input type="date" id="filterTanggal">
        <button class="btn-refresh" onclick="loadData()">🔄 Tampilkan</button>
        <button class="btn-cetak" onclick="window.print()">🖨️ Cetak / Save PDF</button>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
      <div id="infoTanggal" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
      <div id="loading">⏳ Memuat data dari Google Sheets...</div>
      <table id="tabelAbsen" style="display:none;">
        <thead>
          <tr>
            <th>No</th><th>Nama Guru</th><th>NIP</th><th>Jam Absen</th>
            <th>Status</th><th>Jenis Absen</th><th>Hari</th><th>Koordinat Lokasi</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

<script>
  const URL_GOOGLE_SCRIPT = "PASTE_URL_SCRIPT_KAMU_DI_SINI";
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "kartika123";

  window.onload = function() {
    const hariIni = new Date().toISOString().split('T')[0];
    document.getElementById('filterTanggal').value = hariIni;
  };

  function loginAdmin() {
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    if(user === ADMIN_USER && pass === ADMIN_PASS) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('rekapPage').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginError').innerText = "❌ Username atau Password salah!";
    }
  }
  
  function logout() {
    document.getElementById('rekapPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
  }

  async function loadData() {
    const tgl = document.getElementById('filterTanggal').value;
    document.getElementById('infoTanggal').innerText = `Data Tanggal: ${tgl}`;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tabelAbsen').style.display = 'none';

    // TANPA PROXY DULU BIAR GA RIBET
    const url = `${URL_GOOGLE_SCRIPT}?tgl=${tgl}`;

    try {
      const respon = await fetch(url);
      const dataJson = await respon.json();
      tampilkanTabel(dataJson);
    } catch (error) {
      document.getElementById('loading').innerText = "❌ Gagal konek. Pastiin URL Script sudah Deploy 'Anyone'";
    }
  }

  function tampilkanTabel(data) {
    const tbody = document.getElementById('isiTabel');
    tbody.innerHTML = "";
    if(!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8">Tidak ada data absen di tanggal ini</td></tr>`;
    } else {
      data.forEach((row, i) => {
        const kelasStatus = (row.status === 'Tepat Waktu' || row.status === 'Pulang')? 'status-tepat' : 'status-telat';
        tbody.innerHTML += `<tr>
          <td>${i+1}</td><td>${row.nama}</td><td>${row.nip}</td><td>${row.jam}</td>
          <td class="${kelasStatus}">${row.status}</td><td>${row.jenis}</td><td>${row.hari}</td><td><small>${row.lokasi}</small></td>
        </tr>`;
      });
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tabelAbsen').style.display = 'table';
  }
</script>
</body>
</html>
