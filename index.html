<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Digital Kartika</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    h1 { color: #2c3e50; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #2980b9; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Absensi Kartika</h1>
    <p>Silakan isi data kehadiran</p>
    <input type="text" id="nama" placeholder="Nama Lengkap" required>
    <input type="text" id="kelas" placeholder="Kelas" required>
    <button onclick="absen()">Kirim Absensi</button>
    <div id="status"></div>
  </div>

  <script>
    const URL_GOOGLE_SHEET = "GANTI_DENGAN_LINK_KAMU_NANTI"

    function absen() {
      const nama = document.getElementById('nama').value;
      const kelas = document.getElementById('kelas').value;
      const status = document.getElementById('status');
      
      if(nama === '' || kelas === '') {
        status.innerHTML = 'Nama dan Kelas wajib diisi!';
        status.style.color = 'red';
        return;
      }

      status.innerHTML = 'Mengirim...';
      status.style.color = 'blue';

      fetch(URL_GOOGLE_SHEET, {
        method: 'POST',
        body: JSON.stringify({nama, kelas, waktu: new Date().toLocaleString("id-ID")})
      })
      .then(res => {
        status.innerHTML = 'Terima kasih ' + nama + ', absensi berhasil!';
        status.style.color = 'green';
        document.getElementById('nama').value = '';
        document.getElementById('kelas').value = '';
      })
      .catch(err => {
        status.innerHTML = 'Gagal kirim. Coba lagi.';
        status.style.color = 'red';
      });
    }
  </script>
</body>
</html>
