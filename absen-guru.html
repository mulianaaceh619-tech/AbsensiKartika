<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Guru SMP KARTIKA XIV</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 500px; text-align: center; }
    h2 { color: #2c3e50; margin-bottom: 5px; }
    .jam-info { background: #f1f8ff; padding: 15px; border-radius: 12px; margin: 15px 0; font-size: 14px; border-left: 4px solid #3498db; text-align: center; }
    input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; box-sizing: border-box; text-align: center; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; color: white; transition: 0.2s; }
    button:disabled { background: #95a5a6 !important; cursor: not-allowed; }
    .btn-masuk { background: #27ae60; }
    .btn-masuk:hover { background: #219653; }
    .btn-pulang { background: #e67e22; }
    .btn-pulang:hover { background: #d35400; }
    #status { margin-top: 20px; font-weight: bold; font-size: 15px; line-height: 1.5; }
    .tepat { color: #27ae60; }.telat { color: #c0392b; }.info { color: #2980b9; }
    .rekap-link { display: inline-block; margin-top: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
    .rekap-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📋 Absensi Guru</h2>
    <p><b>SMP KARTIKA XIV BANDA ACEH</b></p>
    <div class="jam-info" id="jamInfo"></div>
    <!-- Hanya Input NIP, Input Password Sudah Dihapus -->
    <input type="text" id="nip" placeholder="Masukkan NIP Anda">
    <div class="btn-group">
      <button id="btnMasuk" class="btn-masuk" onclick="absen('masuk')">Absen Masuk</button>
      <button id="btnPulang" class="btn-pulang" onclick="absen('pulang')">Absen Pulang</button>
    </div>
    <div id="status"></div>
    <br><a class="rekap-link" href="/guru.html">Lihat Rekap Data Siswa</a>
  </div>

<script>
  https://script.google.com/macros/s/AKfycbywJ1jre0rLKXtRJgrebZBXrEUQIM0LWi5VG1DecnTLUhnY6ua5yr50hQpiEXwu2R-X/exec";
  
  // Database Guru (Parameter Password 'pass' sudah dihapus demi kemudahan)
  const daftarGuru = [
    {nama: "Sabriadi,S.Pd", nip: "197705092007011016"},
    {nama: "Ainal Mardhiah,S.Pd", nip: "19670810198012001"},
    {nama: "Drs.Baihaki", nip: "196607192006041003"},
    {nama: "Jemi Noven,S.Pd", nip: "199111032019031006"},
    {nama: "Khalisna Fitri,S.Pd", nip: "123456"},
    {nama: "Nabila Muridha,S.Pd", nip: "1234567"},
    {nama: "Rina Diana,S.Pd,M.Pd", nip: "198007302006042014"},
    {nama: "RUZIKNA,S.Pd", nip: "12345678"},
    {nama: "Samsul Bahri,S.Pd", nip: "19811002200501003"},
    {nama: "Siti Sarah,S.Pd", nip: "123456789"},
    {nama: "Nanda Phonna,S.Pd", nip: "12345678910"},
    {nama: "Dien jauhari,S.Pd,M.Pd", nip: "12345678911"}
  ];

  const JAM_MASUK_BATAS = "07:30:00";
  const JAM_PULANG = { 1: "13:00:00", 2: "13:00:00", 3: "13:00:00", 4: "13:00:00", 5: "11:30:00", 6: "12:00:00", 0: "Libur" };
  const hariIni = new Date().getDay();
  const namaHari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  
  document.getElementById('jamInfo').innerHTML =
    `<b>Hari ini: ${namaHari[hariIni]}</b><br>
     Batas Jam Masuk: ${JAM_MASUK_BATAS} | Jam Pulang: ${JAM_PULANG[hariIni]}`;

  if(localStorage.getItem('nipLogin')){
    document.getElementById('nip').value = localStorage.getItem('nipLogin');
  }

  function absen(jenis){
    const nip = document.getElementById('nip').value.trim();
    const status = document.getElementById('status');
    const btnMasuk = document.getElementById('btnMasuk');
    const btnPulang = document.getElementById('btnPulang');
    
    // Validasi login HANYA mencocokkan nomor NIP saja
    const guru = daftarGuru.find(g => g.nip === nip);
    if(!guru){ 
      status.innerHTML = "❌ Nomor NIP tidak terdaftar dalam sistem!"; 
      status.className = "telat"; 
      return; 
    }

    localStorage.setItem('nipLogin', nip); 

    status.innerHTML = "⏳ Menghubungkan jaringan server...";
    status.className = "info";
    btnMasuk.disabled = true;
    btnPulang.disabled = true;

    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const latUser = position.coords.latitude;
        const lngUser = position.coords.longitude;
        
        const sekarang = new Date();
        const yyyy = sekarang.getFullYear();
        const mm = String(sekarang.getMonth() + 1).padStart(2, '0');
        const dd = String(sekarang.getDate()).padStart(2, '0');
        const jamFormat = `${String(sekarang.getHours()).padStart(2, '0')}:${String(sekarang.getMinutes()).padStart(2, '0')}:${String(sekarang.getSeconds()).padStart(2, '0')}`;
        
        let statusMasukAtauPulang = "-";
        if(jenis === 'masuk') {
          const waktuSekarangMenit = (sekarang.getHours() * 60) + sekarang.getMinutes();
          const batasMasukMenit = (7 * 60) + 30; 
          statusMasukAtauPulang = waktuSekarangMenit > batasMasukMenit ? "Terlambat" : "Tepat Waktu";
        } else {
          statusMasukAtauPulang = "Pulang";
        }
        
        const payload = {
          tanggal: `${yyyy}-${mm}-${dd}`,
          nama: guru.nama,
          nip: guru.nip,
          jam: jamFormat,
          status: statusMasukAtauPulang,
          jenis: jenis,
          hari: namaHari[hariIni],
          lokasi: `${latUser.toFixed(6)}, ${lngUser.toFixed(6)}`
        };

        try {
          await fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          
          status.innerHTML = `✅ Berhasil Absen ${jenis === 'masuk' ? 'Masuk' : 'Pulang'}<br>Selamat Bertugas, <b>${guru.nama}</b>!<br><small>Status: ${statusMasukAtauPulang} (${jamFormat})</small>`;
          status.className = "tepat";
          
        } catch (error) {
          status.innerHTML = "❌ Gangguan Sistem Jaringan Server Google Sheets.";
          status.className = "telat";
        }

        btnMasuk.disabled = false;
        btnPulang.disabled = false;
      },
      async () => { 
        // BACKUP JIKA GPS PERANGKAT ERROR / MATI
        const sekarang = new Date();
        const yyyy = sekarang.getFullYear();
        const mm = String(sekarang.getMonth() + 1).padStart(2, '0');
        const dd = String(sekarang.getDate()).padStart(2, '0');
        const jamFormat = `${String(sekarang.getHours()).padStart(2, '0')}:${String(sekarang.getMinutes()).padStart(2, '0')}:${String(sekarang.getSeconds()).padStart(2, '0')}`;
        
        let statusMasukAtauPulang = "Tepat Waktu";
        if(jenis === 'masuk' && ((sekarang.getHours() * 60) + sekarang.getMinutes() > (7 * 60) + 30)) {
          statusMasukAtauPulang = "Terlambat";
        } else if (jenis === 'pulang') {
          statusMasukAtauPulang = "Pulang";
        }

        const payload = {
          tanggal: `${yyyy}-${mm}-${dd}`,
          nama: guru.nama,
          nip: guru.nip,
          jam: jamFormat,
          status: statusMasukAtauPulang,
          jenis: jenis,
          hari: namaHari[hariIni],
          lokasi: "0, 0 (GPS Perangkat Offline)"
        };

        try {
          await fetch(URL_GOOGLE_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          status.innerHTML = `✅ Berhasil Absen ${jenis === 'masuk' ? 'Masuk' : 'Pulang'}<br>Selamat Bertugas, <b>${guru.nama}</b>!<br><small>Status: ${statusMasukAtauPulang} (${jamFormat})</small>`;
          status.className = "tepat";
        } catch (error) {
          status.innerHTML = "❌ Gangguan Sambungan Server Sheet.";
          status.className = "telat";
        }
        btnMasuk.disabled = false;
        btnPulang.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 5000 }
    );
  }
</script>
</body>
</html>
