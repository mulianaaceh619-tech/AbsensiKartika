<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Guru SMP KARTIKA XIV</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 500px; text-align: center; }
    h2 { color: #2c3e50; margin-bottom: 5px; }
    .jam-info { background: #f1f8ff; padding: 15px; border-radius: 12px; margin: 15px 0; font-size: 14px; border-left: 4px solid #3498db; text-align: center; }
    input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; color: white; transition: 0.2s; }
    button:disabled { background: #95a5a6 !important; cursor: not-allowed; }
    .btn-masuk { background: #27ae60; }
    .btn-masuk:hover { background: #219653; }
    .btn-pulang { background: #e67e22; }
    .btn-pulang:hover { background: #d35400; }
    #status { margin-top: 20px; font-weight: bold; font-size: 15px; line-height: 1.5; }
    .tepat { color: #27ae60; }.telat { color: #c0392b; }.info { color: #2980b9; }
    .rekap-link { display: inline-block; margin-top: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
    .rekap-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📋 Absensi Guru</h2>
    <p><b>SMP KARTIKA XIV BANDA ACEH</b></p>
    <div class="jam-info" id="jamInfo"></div>
    <input type="text" id="nip" placeholder="Masukkan NIP">
    <input type="password" id="pass" placeholder="Masukkan Password">
    <div class="btn-group">
      <button id="btnMasuk" class="btn-masuk" onclick="absen('masuk')">Absen Masuk</button>
      <button id="btnPulang" class="btn-pulang" onclick="absen('pulang')">Absen Pulang</button>
    </div>
    <div id="status"></div>
    <br><a class="rekap-link" href="/guru.html">Lihat Rekap Data Siswa</a>
  </div>

<script>
  // 1. URL APPS SCRIPT BERDASARKAN BACKEND ANDA
  const URL_GOOGLE_SCRIPT = "https://google.com";
  
  // 2. KOORDINAT DAN RADIUS (DIPERLONGGAR MENJADI 3,5 KM UNTUK TOLERANSI WI-FI INDIHOME/BIZNET)
  const LOKASI_SEKOLAH = { lat: 5.5433682, lng: 95.3213901 }; 
  const RADIUS_METER = 3500; 
  
  // 3. DATABASE GURU
  const daftarGuru = [
    {nama: "Sabriadi,S.Pd", nip: "197705092007011016", pass: "guru12345"},
    {nama: "Ainal Mardhiah,S.Pd", nip: "19670810198012001", pass: "guru12345"},
    {nama: "Drs.Baihaki", nip: "196607192006041003", pass: "guru12345"},
    {nama: "Jemi Noven,S.Pd", nip: "199111032019031006", pass: "guru12345"},
    {nama: "Khalisna Fitri,S.Pd", nip: "123456", pass: "guru12345"},
    {nama: "Nabila Muridha,S.Pd", nip: "1234567", pass: "guru12345"},
    {nama: "Rina Diana,S.Pd,M.Pd", nip: "198007302006042014", pass: "guru12345"},
    {nama: "RUZIKNA,S.Pd", nip: "12345678", pass: "guru12345"},
    {nama: "Samsul Bahri,S.Pd", nip: "19811002200501003", pass: "guru12345"},
    {nama: "Siti Sarah,S.Pd", nip: "123456789", pass: "guru12345"},
    {nama: "Nanda Phonna,S.Pd", nip: "12345678910", pass: "guru12345"},
    {nama: "Dien jauhari,S.Pd,M.Pd", nip: "12345678911", pass: "guru12345"}
  ];

  // 4. ATURAN JAM KERJA
  const JAM_MASUK_BATAS = "07:30:00";
  const JAM_PULANG = { 1: "13:00:00", 2: "13:00:00", 3: "13:00:00", 4: "13:00:00", 5: "11:30:00", 6: "12:00:00", 0: "Libur" };
  const hariIni = new Date().getDay();
  const namaHari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  
  // Tampilkan informasi waktu hari ini di box biru
  document.getElementById('jamInfo').innerHTML =
    `<b>Hari ini: ${namaHari[hariIni]}</b><br>
     Batas Jam Masuk: ${JAM_MASUK_BATAS} | Jam Pulang: ${JAM_PULANG[hariIni]}`;

  // Mengisi otomatis input NIP terakhir jika tersimpan di memori hp/browser
  if(localStorage.getItem('nipLogin')){
    document.getElementById('nip').value = localStorage.getItem('nipLogin');
  }

  // Fungsi kalkulasi rumus Haversine Jarak GPS
  function hitungJarak(lat1, lon1, lat2, lon2) {
    const R = 6371e3; 
    const φ1 = lat1 * Math.PI/180; 
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180; 
    const Δλ = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)*Math.sin(Δλ/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Fungsi utama pemprosesan absensi
  function absen(jenis){
    const nip = document.getElementById('nip').value.trim();
    const pass = document.getElementById('pass').value.trim();
    const status = document.getElementById('status');
    const btnMasuk = document.getElementById('btnMasuk');
    const btnPulang = document.getElementById('btnPulang');
    
    // Validasi akun guru lokal
    const guru = daftarGuru.find(g => g.nip === nip && g.pass === pass);
    if(!guru){ 
      status.innerHTML = "❌ NIP atau Password salah!"; 
      status.className = "telat"; 
      return; 
    }

    // Simpan data NIP ke memori lokal browser agar guru tidak capek mengetik ulang besok
    localStorage.setItem('nipLogin', nip); 

    // Tampilkan efek loading animasi dan kunci tombol agar tidak tertekan dua kali
    status.innerHTML = "⏳ Menghubungkan jaringan & mengunci lokasi...";
    status.className = "info";
    btnMasuk.disabled = true;
    btnPulang.disabled = true;

    // Meminta akses Geolocation Browser
    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const latUser = position.coords.latitude;
        const lngUser = position.coords.longitude;
        const jarak = hitungJarak(latUser, lngUser, LOKASI_SEKOLAH.lat, LOKASI_SEKOLAH.lng);
        
        // Cek batasan radius jarak aman sekolah
        if(jarak > RADIUS_METER){ 
          status.innerHTML = `❌ Gagal! Anda ${Math.round(jarak)}m dari sekolah<br><small>Pastikan Anda terhubung ke Wi-Fi Resmi Sekolah</small>`; 
          status.className = "telat"; 
          btnMasuk.disabled = false;
          btnPulang.disabled = false;
          return; 
        }
        
        // Membaca generator waktu lokal perangkat real-time
        const sekarang = new Date();
        const yyyy = sekarang.getFullYear();
        const mm = String(sekarang.getMonth() + 1).padStart(2, '0');
        const dd = String(sekarang.getDate()).padStart(2, '0');
        
        const jam = String(sekarang.getHours()).padStart(2, '0');
        const menit = String(sekarang.getMinutes()).padStart(2, '0');
        const detik = String(sekarang.getSeconds()).padStart(2, '0');
        
        const tglFormat = `${yyyy}-${mm}-${dd}`;
        const jamFormat = `${jam}:${menit}:${detik}`;

        // Perhitungan sistem penilaian keterlambatan logis otomatis
        let statusMasukAtauPulang = "-";
        if(jenis === 'masuk') {
          const waktuSekarangMenit = (sekarang.getHours() * 60) + sekarang.getMinutes();
          const batasMasukMenit = (7 * 60) + 30; // Jam 07:30 dalam satuan menit hitungan hari
          statusMasukAtauPulang = waktuSekarangMenit > batasMasukMenit ? "Terlambat" : "Tepat Waktu";
        } else {
          statusMasukAtauPulang = "Pulang";
        }
        
        // Pembuatan struktur paket objek JSON untuk diposting ke e.postData di Apps Script
        const payload = {
          tanggal: tglFormat,
          nama: guru.nama,
          nip: guru.nip,
          jam: jamFormat,
          status: statusMasukAtauPulang,
          jenis: jenis,
          hari: namaHari[hariIni],
          lokasi: `${latUser.toFixed(6)}, ${lngUser.toFixed(6)}`
        };

        status.innerHTML = "⏳ Menyimpan data absensi Anda ke server Google Sheets...";

        // Mengirimkan paket data mentah via REST API Fetch metode POST 
        try {
          const response = await fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "no-cors", // Mode no-cors mencegah hambatan kendala keamanan Same-Origin-Policy di web
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          
          // Karena menggunakan mode no-cors, kita anggap pengiriman data berhasil jika tidak masuk ke blok catch eror
          status.innerHTML = `✅ Berhasil Absen ${jenis === 'masuk' ? 'Masuk' : 'Pulang'}<br>Selamat Tugas, <b>${guru.nama}</b>!<br><small>Status: ${statusMasukAtauPulang} (${jamFormat})</small>`;
          status.className = "tepat";
          document.getElementById('pass').value = ""; // Kosongkan kolom sandi demi keamanan data privasi guru
          
        } catch (error) {
          status.innerHTML = "❌ Gangguan Sistem Jaringan Server / Google Apps Script Down.";
          status.className = "telat";
        }

        // Buka kembali kunci tombol setelah selesai proses
        btnMasuk.disabled = false;
        btnPulang.disabled = false;
      },
      (error) => { 
        status.innerHTML = "❌ Gagal mendeteksi lokasi! Harap aktifkan sistem GPS HP Anda dan beri browser izin melacak lokasi."; 
        status.className = "telat"; 
        btnMasuk.disabled = false;
        btnPulang.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000 } // Paksa browser menggunakan hardware modul satelit GPS akurasi tinggi
    );
  }
</script>
</body>
</html>
